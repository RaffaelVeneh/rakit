upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300

; High-performance realpath cache for Windows/WSL2 mounted volumes
realpath_cache_size = 64M
realpath_cache_ttl = 86400

; OPcache, tuned for a bind-mounted development tree.
;
; Timestamp validation MUST stay on here. The source is a live mount, so with
; opcache.validate_timestamps=0 an edited PHP file keeps serving its old compiled
; form until php-fpm is restarted, and the failure looks like a code change that
; "did nothing".
;
; revalidate_freq is the other half of that trade and must not be small. It is the
; window during which a cached file is trusted without re-checking its timestamp.
; At 0 or 2, essentially every request re-stats all ~750 cached scripts, and across
; a Windows bind mount each stat crosses the host boundary: measured at 6.5-8s per
; page render. The window is not free either — whichever request follows a gap
; longer than it pays for every file at once (measured: 8.7s once, then 0.5s per
; request in a burst). So the number is a straight trade: shorter means quicker
; feedback on an edit, longer means fewer stalls. 60 keeps the stall to at most one
; per worker per minute and still picks up an edit on its own.
;
; When an edit must appear now, restart the worker — that is instant and pays the
; cost once, out of the reader's way:
;
;     docker compose restart app
;
; A deployed environment does not run this file's balance at all: there, source is
; baked into the image rather than mounted, and opcache.validate_timestamps = 0 is
; correct because nothing changes under a running worker.
opcache.enable = 1
opcache.enable_cli = 1
opcache.enable_file_override = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = 1
opcache.fast_shutdown = 1
